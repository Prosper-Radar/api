services:
  - type: web
    name: dealscout-api
    env: python
    region: oregon
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dealscout-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: MIAMI_DADE_API_KEY
        sync: false
      - key: CENSUS_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
    healthCheckPath: /health
    autoDeploy: true

databases:
  - name: dealscout-db
    plan: starter
    postgresMajorVersion: 16
